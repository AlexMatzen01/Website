<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application Viewer</title>
    <!-- Completely open CSP to allow the proxy engine to fetch the app assets and handle the API -->
    <meta http-equiv="Content-Security-Policy" content="
        default-src * 'unsafe-inline' 'unsafe-eval' data: blob:;
        frame-src * data: blob:;
        connect-src * data: blob:;
        img-src * data: blob:;
        media-src * data: blob:;
        font-src * data: blob:;
    ">
    <style>
        html, body { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; background: #000; font-family: sans-serif; }
        #app-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; border: 0; display: block; }
        #loading { position: fixed; inset: 0; display: flex; justify-content: center; align-items: center; color: #fff; background: #000; z-index: 99; font-size: 1.2rem; }
    </style>
</head>
<body>

    <div id="loading">Initializing Secure Proxy Network...</div>
    <iframe id="app-container" style="display:none;" referrerpolicy="no-referrer"></iframe>

    <!-- Load the standard open-source proxy service worker script -->
    <script src="https://jsdelivr.net"></script>
    <script src="https://jsdelivr.net"></script>

    <script>
        const iframe = document.getElementById("app-container");
        const loadingScreen = document.getElementById("loading");

        // Target site configuration
        const TARGET_SITE = "https://hunkon.me";

        async function initProxy() {
            try {
                // Register the service worker to intercept network/API calls silently in the background
                if ('serviceWorker' in navigator) {
                    // Registering proxy framework
                    await navigator.serviceWorker.register('https://jsdelivr.net', {
                        scope: __uv$config.prefix
                    });

                    // Build the fully obfuscated proxy URL using Ultraviolet's internal encoder
                    // This hides "app.hunkon.me" and "api.hunkon.me" from Securly's network filters entirely
                    const encodedUrl = __uv$config.prefix + __uv$config.encodeUrl(TARGET_SITE);
                    
                    // Load the proxy stream into the iframe container
                    iframe.src = encodedUrl;

                    iframe.addEventListener("load", () => {
                        loadingScreen.style.display = "none";
                        iframe.style.display = "block";
                    });
                } else {
                    loadingScreen.innerText = "Error: Your browser does not support Service Workers.";
                }
            } catch (err) {
                console.error("Proxy Init Failed, falling back to Base64 Blob wrapper:", err);
                fallbackLoad();
            }
        }

        // Fallback strategy if the network CDN blocks service worker registrations
        function fallbackLoad() {
            // Encode the target into a browser-native system Blob object (bypasses basic string filters)
            const rawHtml = `
                <!DOCTYPE html>
                <html>
                <head><style>html,body,iframe{width:100%;height:100%;margin:0;padding:0;overflow:hidden;background:#000;}</style></head>
                <body>
                    <iframe src="${TARGET_SITE}" sandbox="allow-scripts allow-same-origin allow-forms allow-downloads allow-popups"></iframe>
                </body>
                </html>
            `;
            const blob = new Blob([rawHtml], { type: 'text/html' });
            iframe.src = URL.createObjectURL(blob);
            
            loadingScreen.style.display = "none";
            iframe.style.display = "block";
        }

        // Bootstrap the application layout
        initProxy();
    </script>
</body>
</html>
